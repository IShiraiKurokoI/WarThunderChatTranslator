name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore WarThunderChatTranslator.Tests/WarThunderChatTranslator.Tests.csproj

      - name: Run tests
        run: >-
          dotnet test WarThunderChatTranslator.Tests/WarThunderChatTranslator.Tests.csproj
          --configuration Release
          --no-restore
