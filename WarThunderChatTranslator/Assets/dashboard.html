<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天消息列表</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- 引用动态生成的 CSS -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>实时聊天消息列表</h1>
    <div id="chat-container"></div>

    <script>
        async function fetchChatData() {
            try {
                const response = await fetch('/gamechat');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const chatMessages = await response.json();
                renderChatMessages(chatMessages);
            } catch (error) {
                console.error('Failed to fetch chat messages:', error);
            }
        }

        function renderChatMessages(chatMessages) {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = '';

            chatMessages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('chat-message');

                if (!message.Sender && message.Enemy) {
                    messageDiv.classList.add('system');
                } else if (message.Enemy) {
                    messageDiv.classList.add('enemy');
                } else {
                    messageDiv.classList.add('ally');
                }

                const messageText = document.createElement('span');
                messageText.textContent = `[${message.Mode}] ${message.Sender || '系统'}: ${message.TranslatedMessage}`;
                messageDiv.appendChild(messageText);

                chatContainer.appendChild(messageDiv);
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function test() {
            const testMessages = [
                {
                    Mode: "友军",
                    Sender: "玩家1",
                    TranslatedMessage: "大家加油，我们快赢了！",
                    Enemy: false
                },
                {
                    Mode: "所有人",
                    Sender: "敌方玩家",
                    TranslatedMessage: "你们根本打不过我们！",
                    Enemy: true
                },
                {
                    Mode: "所有人",
                    Sender: "",
                    TranslatedMessage: "比赛将在5分钟后结束。",
                    Enemy: true
                },
                {
                    Mode: "友军",
                    Sender: "玩家2",
                    TranslatedMessage: "注意左侧有人埋伏！",
                    Enemy: false
                },
                {
                    Mode: "所有人",
                    Sender: "敌方玩家",
                    TranslatedMessage: "真是一场激烈的战斗！",
                    Enemy: true
                },
                {
                    Mode: "所有人",
                    Sender: "",
                    TranslatedMessage: "服务器将在10分钟后维护。",
                    Enemy: true
                }
            ];

            renderChatMessages(testMessages);
        }

        setInterval(fetchChatData, 4000);
        fetchChatData();
    </script>
</body>
</html>
