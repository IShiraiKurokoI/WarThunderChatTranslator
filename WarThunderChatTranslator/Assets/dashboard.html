<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天消息列表</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- Reference dynamically generated CSS. -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>实时聊天消息列表</h1>
    <div id="chat-container"></div>

    <script>
        let lastId = 0;
        let processGeneration = 0;
        let fetchInProgress = false;
        let webPollIntervalMs = 4000;
        let pollTimer = null;

        async function fetchChatData() {
            if (fetchInProgress) {
                return;
            }

            fetchInProgress = true;
            try {
                const response = await fetch(`/gamechat?lastId=${lastId}&session=${processGeneration}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const responseGeneration = Number(response.headers.get('X-Game-Process-Generation') || response.headers.get('X-Game-Session') || '0');
                const configuredInterval = Number(response.headers.get('X-Web-Poll-Interval-Ms') || '4000');
                if (Number.isFinite(configuredInterval) && configuredInterval >= 1000) {
                    webPollIntervalMs = configuredInterval;
                }

                const chatMessages = await response.json();

                // The generation changes only when the monitored game process instance changes. It does not identify individual battles within the same PID.
                if (responseGeneration !== processGeneration) {
                    processGeneration = responseGeneration;
                    lastId = 0;
                    document.getElementById('chat-container').innerHTML = '';
                }

                appendChatMessages(chatMessages);

                if (chatMessages.length > 0) {
                    lastId = Math.max(lastId, ...chatMessages.map(message => message.Id));
                }
            } catch (error) {
                console.error('Failed to fetch chat messages:', error);
            } finally {
                fetchInProgress = false;
                scheduleNextPoll();
            }
        }

        function scheduleNextPoll() {
            if (pollTimer !== null) {
                clearTimeout(pollTimer);
            }
            pollTimer = setTimeout(fetchChatData, webPollIntervalMs);
        }

        function appendChatMessages(chatMessages) {
            const chatContainer = document.getElementById('chat-container');
            const fragment = document.createDocumentFragment();

            chatMessages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('chat-message');

                if (!message.Sender && message.Enemy) {
                    messageDiv.classList.add('system');
                } else if (message.Enemy) {
                    messageDiv.classList.add('enemy');
                } else {
                    messageDiv.classList.add('ally');
                }

                const messageText = document.createElement('span');
                messageText.textContent = `[${message.Mode}] ${message.Sender || '系统'}: ${message.TranslatedMessage}`;
                messageDiv.appendChild(messageText);
                fragment.appendChild(messageDiv);
            });

            if (chatMessages.length > 0) {
                chatContainer.appendChild(fragment);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Load immediately on first visit, then schedule serial polls using the server-provided web polling interval.
        fetchChatData();
    </script>
</body>
</html>
